[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-chronos2"
version = "0.0.1"
description = "MLX inference backend for Chronos-2 on Apple Silicon"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.31",
    "numpy",
    "pandas",
    "pyarrow",
    "huggingface_hub",
    "safetensors",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
    "build",
    "torch",
    "chronos-forecasting>=2.1.0",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "parity: parity tests requiring torch + chronos-forecasting (deselect with -m 'not parity')",
]
